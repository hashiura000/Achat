<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Achatログイン画面</title>
</head>
<body>
	<h1>Achat</h1><br>
	<h2>ログイン名を入力してください</h2>
	<h3>※当サイトは紹介制のチャットアプリなので、ご友人の方から名前を登録してもらって以下のログイン名を入力ください</h3><br>
	<form action="/Achat/Login" method="get" accept-charset="UTF-8">
		<label for="textbox">ログイン名：</label>
		<input type="text" name="name">
		<input type="submit" value="送信">
	</form>
</body>
</html>
